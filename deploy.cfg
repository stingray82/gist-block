; ============================================================
; UNIVERSAL DEPLOY v1.5.2
; GIST EMBEDDED — GITHUB RELEASE
; ============================================================
;
; Reusable GitHub-only deployment configuration.
;
; Change the plugin-specific settings for each repository.
; Shared PHP tools and credentials remain centrally stored.
;
; ============================================================
; 1. PLUGIN DETAILS
; ============================================================

PLUGIN_NAME=Gist Embedded
PLUGIN_SLUG=rup-gist-embedded
PLUGIN_DIR=rup-gist-embedded
PLUGIN_FILE=rup-gist-embedded/rup-gist-embedded.php

PLUGIN_TAGS=Gists,Block,Gist-block

; ============================================================
; 2. DEPLOYMENT TARGET
; ============================================================

; github       = GitHub release only
; github+local = GitHub release + SyncBack folder
; local        = Local folder only

DEPLOY_TARGET=github

; 1 = build only, 0 = publish
DEPLOY_DRY_RUN=0

; ============================================================
; 3. CENTRAL SHARED TOOLS
; ============================================================

UNIVERSAL_HOME=C:/Ignore By Avast/0. PATHED Items/Plugins/deployscripts/universal

HEADER_SCRIPT=C:/Ignore By Avast/0. PATHED Items/Plugins/deployscripts/universal/tools/myplugin_headers_rup_gpl3.0.php

GENERATOR_SCRIPT=C:/Ignore By Avast/0. PATHED Items/Plugins/deployscripts/universal/tools/generate_index.php

; ============================================================
; 4. GITHUB SETTINGS
; ============================================================

GITHUB_REPO=stingray82/gist-block
GITHUB_CREDENTIAL_PROFILE=stingray82

GIT_BRANCH=main

; 1 = commit and push modified source and UUPD metadata
; Recommended when updater reads GitHub-hosted uupd/index.json
GIT_PUSH_SOURCE=1

; ============================================================
; 5. PACKAGE SETTINGS
; ============================================================

; Preserve existing GitHub release asset name
ZIP_NAME=rup-gist-embedded.zip

; Leave release archives in place
CLEANUP_RELEASE_ZIPS=0

; Used for local or github+local targets
DEST_DIR=D:/updater.reallyusefulplugins.com/plugin-updates/custom-packages

; ============================================================
; 6. CHANGELOG AND UUPD METADATA
; ============================================================

CHANGELOG_FILE=C:/Users/Nathan/Git/rup-changelogs/gist-embeded.txt

STATIC_FILE=static.txt

; Metadata generated in repository's uupd/ folder
; Ensure GIT_PUSH_SOURCE=1 to publish changes to GitHub

; ============================================================
; 7. ZIP UTILITY
; ============================================================

SEVEN_ZIP=C:/Ignore By Avast/7-ZipPortable/App/7-Zip/7z.exe

; ============================================================
; END OF CONFIGURATION
; ============================================================

